<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <rect width="800" height="500" rx="16" fill="#080c10"/>
  <defs>
    <radialGradient id="deckGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#66e0b5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#080c10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deckBorder" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <rect width="800" height="500" rx="16" fill="url(#deckGlow)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Window Header -->
  <rect x="40" y="35" width="720" height="42" rx="10" fill="#0d141b" stroke="url(#deckBorder)" stroke-width="1"/>
  <circle cx="68" cy="56" r="5" fill="#ff5f56"/>
  <circle cx="86" cy="56" r="5" fill="#ffbd2e"/>
  <circle cx="104" cy="56" r="5" fill="#27c93f"/>
  <text x="135" y="60" fill="#66e0b5" font-family="monospace" font-size="11" font-weight="bold">sean-portfolio ~ zsh</text>
  <rect x="620" y="47" width="120" height="18" rx="4" fill="#ffffff" fill-opacity="0.05"/>
  <text x="635" y="60" fill="#8892b0" font-family="monospace" font-size="9">PROD • VERCEL</text>

  <!-- HUD Telemetry Panel (Left) -->
  <rect x="40" y="95" width="345" height="365" rx="12" fill="#0b1016" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="65" y="130" fill="#8892b0" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="1">SYSTEM TELEMETRY</text>
  
  <rect x="65" y="150" width="295" height="56" rx="8" fill="#111822" stroke="#ffffff" stroke-opacity="0.04"/>
  <text x="80" y="174" fill="#66e0b5" font-family="sans-serif" font-size="16" font-weight="bold">399 Contributions</text>
  <text x="80" y="193" fill="#8892b0" font-family="monospace" font-size="10">Active Streak • 2026 Commit Cadence</text>

  <rect x="65" y="220" width="295" height="56" rx="8" fill="#111822" stroke="#ffffff" stroke-opacity="0.04"/>
  <text x="80" y="244" fill="#68c4ff" font-family="sans-serif" font-size="16" font-weight="bold">SSR + Edge Ready</text>
  <text x="80" y="263" fill="#8892b0" font-family="monospace" font-size="10">Astro 5.x • 99+ Lighthouse Score</text>

  <rect x="65" y="290" width="295" height="145" rx="8" fill="#111822" stroke="#ffffff" stroke-opacity="0.04"/>
  <text x="80" y="318" fill="#ffb84d" font-family="monospace" font-size="11" font-weight="bold">DSLR CAMERA HUD</text>
  <text x="80" y="342" fill="#e2e8f0" font-family="monospace" font-size="10">ISO 100 • 50mm f/1.8 • 1/250s</text>
  <text x="80" y="365" fill="#8892b0" font-family="monospace" font-size="10">Grid overlay • Manual focus peaking</text>
  <circle cx="85" cy="405" r="4" fill="#66e0b5"/>
  <text x="96" y="409" fill="#66e0b5" font-family="monospace" font-size="10">REC • 4K 60FPS UNCOMPRESSED</text>

  <!-- Interactive Terminal CLI (Right) -->
  <rect x="405" y="95" width="355" height="365" rx="12" fill="#090d12" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="430" y="130" fill="#8892b0" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="1">INTERACTIVE CLI EMULATOR</text>
  
  <text x="430" y="165" fill="#66e0b5" font-family="monospace" font-size="11">❯ portfolio</text>
  <text x="510" y="165" fill="#ffffff" font-family="monospace" font-size="11">--view stack</text>
  
  <text x="430" y="195" fill="#8892b0" font-family="monospace" font-size="10">[+] Core: Astro 5.0, TypeScript, TailwindCSS</text>
  <text x="430" y="215" fill="#8892b0" font-family="monospace" font-size="10">[+] Theme: Dark/Light Adaptive State Engine</text>
  <text x="430" y="235" fill="#8892b0" font-family="monospace" font-size="10">[+] Icons: SVG sprite pipelines</text>
  <text x="430" y="255" fill="#8892b0" font-family="monospace" font-size="10">[+] Adapter: @astrojs/vercel (Node/Edge)</text>

  <text x="430" y="295" fill="#66e0b5" font-family="monospace" font-size="11">❯ portfolio</text>
  <text x="510" y="295" fill="#ffffff" font-family="monospace" font-size="11">--status</text>
  <text x="430" y="325" fill="#27c93f" font-family="monospace" font-size="10">✔ All 13 static &amp; server routes compiled</text>
  <text x="430" y="345" fill="#27c93f" font-family="monospace" font-size="10">✔ 0 errors, 0 warnings (astro check)</text>
  
  <rect x="430" y="380" width="305" height="55" rx="6" fill="#101720" stroke="#66e0b5" stroke-opacity="0.3"/>
  <text x="445" y="405" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Type 'help' in live HUD below</text>
  <text x="445" y="423" fill="#66e0b5" font-family="monospace" font-size="10">Interactive terminal accessible in hero</text>
</svg>
